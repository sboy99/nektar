eventbus:
  provider: redis

storage:
  provider: postgres

cache:
  provider: redis

llm:
  provider: gemini

email:
  provider: gmail

publisher:
  provider: discord

redis:
  addr: localhost:6379
  # password: from NEKTAR_REDIS_PASSWORD in .env
  db: 0
  stream_prefix: nektar
  group_name: nektar-workers
  consumer_name: nektar-1

postgres:
  # dsn: from NEKTAR_POSTGRES_DSN in .env (default: local docker compose)
  dsn: postgres://postgres:postgres@localhost:5432/nektar?sslmode=disable

gmail:
  # client_id / client_secret: from .env (NEKTAR_GMAIL_CLIENT_*)
  default_query: "newer_than:7d"

gemini:
  # api_key: from NEKTAR_GEMINI_API_KEY in .env
  model: gemini-2.0-flash
  embed_model: gemini-embedding-001
  embed_dimensions: 768
  embed_cost_per_1m_tokens: 0.15

# discord.webhook_url from NEKTAR_DISCORD_WEBHOOK_URL in .env

newsletter:
  score_threshold: 0.5
  allowlist: []
  denylist: []

extraction:
  min_article_chars: 100
  words_per_minute: 200

embedding:
  cache_ttl: 720h

clustering:
  similarity_threshold: 0.75
  merge_threshold: 0.90

digest:
  prompts_dir: prompts
  lookback: 24h
  min_articles: 3
  min_clusters: 1
  min_cluster_size: 1
  max_clusters: 10
  max_articles_per_cluster: 5
  words_per_minute: 200
  cost_per_1m_tokens: 0.10

scheduler:
  fetch_interval: 15m
  retry_interval: 5m
  publish_interval: 1h
  cache_cleanup_interval: 24h
  events_cleanup_interval: 24h
  oauth_refresh_interval: 12h
  dlq_replay_limit: 100
  event_retention: 168h

server:
  addr: ":8080"
  shutdown_timeout: 10s

logging:
  level: info

retry:
  eventbus_max_attempts: 3
  eventbus_base_backoff: 100ms
  fetch_max_attempts: 3
  fetch_base_backoff: 500ms
